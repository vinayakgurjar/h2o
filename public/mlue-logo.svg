<svg width="400" height="400" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background hex #e3d3ff -->
  <rect width="400" height="400" fill="#e3d3ff" />

  <!-- Logo container in buttons hex #1280d6 -->
  <g transform="translate(130, 90)">
    <rect width="140" height="130" rx="20" fill="#1280d6" />
    
    <!-- Water wave -->
    <path d="M 0 55 C 22 45, 45 62, 70 52 C 95 44, 118 58, 140 50 L 140 130 L 0 130 Z" fill="#0b6db8" opacity="0.35" />

    <!-- Bubbles -->
    <circle cx="45" cy="70" r="4" fill="#e3d3ff" />
    <circle cx="80" cy="60" r="5" fill="#e3d3ff" />
    <circle cx="115" cy="80" r="3.5" fill="#e3d3ff" />
    <circle cx="95" cy="110" r="4" fill="#e3d3ff" />

    <!-- Fish -->
    <g transform="translate(30, 72)">
      <path d="M 18 16 L 4 6 C 7 12, 7 20, 4 26 Z" fill="#e3d3ff" />
      <ellipse cx="32" cy="16" rx="16" ry="12" fill="#e3d3ff" />
      <path d="M 28 4 Q 35 2 40 5 Z" fill="#e3d3ff" />
      <circle cx="41" cy="14" r="2.2" fill="#1280d6" />
    </g>

    <!-- Angled bottle -->
    <g transform="translate(80, 15) rotate(32)">
      <rect x="14" y="2" width="12" height="7" rx="2" fill="#e3d3ff" />
      <rect x="16.5" y="9" width="7" height="6" fill="#e3d3ff" />
      <rect x="11" y="15" width="18" height="36" rx="5" fill="#ffffff" />
      <rect x="11" y="23" width="18" height="15" fill="#1280d6" opacity="0.8" />
    </g>
  </g>

  <!-- Big font hex #006998 -->
  <text x="200" y="280" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#006998" letter-spacing="-1">mlue</text>

  <!-- Small font hex #003940 -->
  <text x="200" y="315" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="14" fill="#003940" letter-spacing="1">Every Bottle Tells Your Story.</text>
</svg>
